name: Windows recording and V0.2a analysis

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Core self-check
        run: python -m blackjack_lab.main --check
      - name: Unit, persistence, recovery and Tk workflow tests
        run: python -m unittest discover -s tests -v
      - name: Compile source and tests
        run: python -m compileall -q blackjack_lab tests scripts
      - name: Seeded independent simulation cross-check
        run: python -c "from scripts.analysis_checks import monte_carlo; r=monte_carlo(6, samples=2500); print(r); assert all(a['passed'] for a in r['actions'].values())"
      - name: Original review handoff and 48 supplementary scenarios
        run: python scripts/verify_review_handoff.py
