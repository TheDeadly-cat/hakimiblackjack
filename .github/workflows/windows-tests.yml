name: Windows recording and V0.2b1 analysis

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Verify exact tested commit
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os,subprocess; actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(); print('TESTED_HEAD='+actual); assert actual==os.environ['EXPECTED_HEAD']"
      - name: Core self-check
        run: python -m blackjack_lab.main --check
      - name: Prepare source-bound Windows split engine
        run: python -m blackjack_lab.main --prepare-split
      - name: Unit, persistence, recovery and Tk workflow tests
        run: python -m unittest discover -s tests -v
      - name: Compile source and tests
        run: python -m compileall -q blackjack_lab tests scripts
      - name: Seeded independent simulation cross-check
        run: python -c "from scripts.analysis_checks import monte_carlo; r=monte_carlo(6, samples=2500); print(r); assert all(a['passed'] for a in r['actions'].values())"
      - name: Original review handoff and 48 supplementary scenarios
        run: python scripts/verify_review_handoff.py
      - name: Original N1 supplemental snapshot tests
        run: python -m unittest discover -s docs/acceptance/n1-20260910-220300-9f6f68/original -p test_snapshot_shape.py -v

  vision:
    name: Optional vision - synthetic contracts only
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Verify exact tested commit
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os,subprocess; actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(); print('VISION_TESTED_HEAD='+actual); assert actual==os.environ['EXPECTED_HEAD']"
      - name: Install optional image and annotation dependencies without WGC
        run: |
          python -m pip install --only-binary=:all: --index-url https://pypi.org/simple -r requirements-vision.txt
      - name: Check the single OpenCV distribution and dependency versions
        run: python -c "import cv2,numpy,PIL,importlib.metadata as m; names={d.metadata['Name'].lower() for d in m.distributions()}; assert 'opencv-python-headless' not in names; assert 'windows-capture' not in names; print('cv2='+cv2.__version__+' numpy='+numpy.__version__+' Pillow='+PIL.__version__); assert m.version('opencv-python')=='5.0.0.93'; assert numpy.__version__=='2.4.6'; assert PIL.__version__=='12.2.0'"
      - name: Synthetic recognition, dataset, model selection, and manual confirmation contracts
        run: python -m unittest discover -s tests -p 'test_vision*.py' -v
      - name: Backend-free capture ownership and generation contracts
        run: python -m unittest discover -s tests -p 'test_capture*.py' -v
      - name: State validation boundary
        run: python -c "print('Synthetic and temporary-local fixtures only. No real media, trained user models, Windows capture runtime, recognition accuracy, or automatic ledger acceptance is certified by this job.')"
